name: YouTube 4K Cloud Downloader & Bilibili Direct Publisher

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube 视频 URL"
        required: true
        default: "https://www.youtube.com/watch?v=PztpR7JfbJE"
      resolution:
        description: "最高视频分辨率 (例如 2160 代表 4K, 1080 代表 1080p)"
        required: true
        default: "2160"
      publish_to_bilibili:
        description: "是否直接发布到 B 站 (true/false)"
        required: true
        default: "true"

jobs:
  download-and-deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Tools & Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl unzip fonts-noto-cjk
          pip install --upgrade yt-dlp requests deep-translator
          # 安装 deno 以便 yt-dlp 执行 YouTube 挑战解密
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Prepare YouTube Credentials (Cookie Secret)
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "========================================="
            echo "🔑 发现有效 YOUTUBE_COOKIES Secret，已注入！"
            echo "========================================="
            printf "%s\n" "$YT_COOKIES" > cookies.txt
            echo "COOKIE_PARAM=--cookies cookies.txt" >> $GITHUB_ENV
          else
            echo "⚠️ 未提供 YOUTUBE_COOKIES Secret，尝试直接访问..."
            echo "COOKIE_PARAM=" >> $GITHUB_ENV
          fi
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      - name: Download 4K Video on Azure Gigabit Backbone (0 Proxy Traffic)
        run: |
          TARGET_URL="${{ github.event.inputs.video_url || 'https://www.youtube.com/watch?v=PztpR7JfbJE' }}"
          MAX_RES="${{ github.event.inputs.resolution || '2160' }}"

          echo "========================================="
          echo "🚀 正在通过微软 Azure 万兆骨干网下载 4K 视频..."
          echo "目标 URL: $TARGET_URL"
          echo "========================================="
          mkdir -p output

          # 策略 1：携带 Cookie 凭证优先下载
          if [ -f cookies.txt ]; then
            echo "👉 [策略 1] 携带 Cookie 凭证下载..."
            yt-dlp \
              --cookies cookies.txt \
              --remote-components ejs:github \
              -f "bestvideo[height<=$MAX_RES]+bestaudio/bestvideo+bestaudio/best" \
              --merge-output-format mp4 \
              --write-sub --write-auto-sub --sub-lang "en.*,zh.*" \
              --write-thumbnail \
              -o "output/%(title)s.%(ext)s" \
              "$TARGET_URL" || true
          fi

          # 策略 2：iOS+Web 降级直连
          if ! ls output/*.mp4 1> /dev/null 2>&1; then
            echo "⚠️ 自动降级为 [策略 2] iOS+Web 多端直连..."
            yt-dlp \
              --remote-components ejs:github \
              --extractor-args "youtube:player_client=ios,web" \
              -f "bestvideo[height<=$MAX_RES]+bestaudio/bestvideo+bestaudio/best" \
              --merge-output-format mp4 \
              --write-sub --write-auto-sub --sub-lang "en.*,zh.*" \
              --write-thumbnail \
              -o "output/%(title)s.%(ext)s" \
              "$TARGET_URL" || true
          fi

          echo "========================================="
          echo "✅ 4K 原画资源下载完成！清单："
          ls -lh output/
          echo "========================================="

      - name: Auto Bilingual Subtitles & Direct Bilibili Publish
        if: ${{ github.event.inputs.publish_to_bilibili != 'false' }}
        run: |
          python3 cloud_pipeline_runner.py
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}

      - name: Upload to GitHub Artifacts (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: youtube-4k-media-${{ github.run_number }}
          path: output/
          retention-days: 7
