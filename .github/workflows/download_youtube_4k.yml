name: YouTube 4K Cloud Downloader (Zero Proxy Traffic)

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube 视频链接'
        required: true
        default: 'https://www.youtube.com/watch?v=dSUdGBhrO5k'
      resolution:
        description: '最高画质 (2160p = 4K, 1080p = 1080p)'
        required: true
        default: '2160'
        type: choice
        options:
          - '2160'
          - '1440'
          - '1080'
          - '720'

jobs:
  download-and-deliver:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp & FFmpeg & Deno
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg curl
          pip install --upgrade yt-dlp
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Prepare YouTube Credentials (Cookie Secret)
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "========================================="
            echo "🔑 发现有效 YOUTUBE_COOKIES Secret，已注入！"
            echo "========================================="
            printf "%s\n" "$YT_COOKIES" > cookies.txt
            echo "COOKIE_PARAM=--cookies cookies.txt" >> $GITHUB_ENV
          else
            echo "⚠️ 未提供 YOUTUBE_COOKIES Secret，使用多端伪装尝试..."
            echo "COOKIE_PARAM=" >> $GITHUB_ENV
          fi

      - name: Download 4K Video on Azure Gigabit Backbone (0 Proxy Traffic)
        run: |
          echo "========================================="
          echo "🚀 正在通过微软 Azure 万兆骨干网下载 4K 视频..."
          echo "========================================="
          mkdir -p output
          
          yt-dlp \
            $COOKIE_PARAM \
            --extractor-args "youtube:player_client=android,ios,web" \
            -f "bestvideo[height<=${{ inputs.resolution }}]+bestaudio/bestvideo+bestaudio/best" \
            --merge-output-format mp4 \
            --write-sub --write-auto-sub --sub-lang "en.*,zh.*" \
            --write-thumbnail \
            -o "output/%(title)s.%(ext)s" \
            "${{ inputs.youtube_url }}"

          echo "========================================="
          echo "✅ 下载完成！输出文件清单："
          ls -lh output/
          echo "========================================="

      - name: Upload to GitHub Artifacts (Free & High Speed)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-4k-video
          path: output/
          retention-days: 7
