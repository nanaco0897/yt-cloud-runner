name: YouTube 4K Cloud Downloader (Zero Proxy Traffic)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube 视频 URL"
        required: true
        default: "https://www.youtube.com/watch?v=dSUdGBhrO5k"
      resolution:
        description: "最高视频分辨率 (例如 2160 代表 4K, 1080 代表 1080p)"
        required: true
        default: "2160"

jobs:
  download-and-deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yt-dlp & FFmpeg & Deno
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl unzip
          pip install --upgrade yt-dlp
          # 安装 deno 以便 yt-dlp 执行 YouTube 挑战解密
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Prepare YouTube Credentials (Cookie Secret)
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "========================================="
            echo "🔑 发现有效 YOUTUBE_COOKIES Secret，已注入！"
            echo "========================================="
            printf "%s\n" "$YT_COOKIES" > cookies.txt
            echo "COOKIE_PARAM=--cookies cookies.txt" >> $GITHUB_ENV
          else
            echo "⚠️ 未提供 YOUTUBE_COOKIES Secret，尝试直接访问..."
            echo "COOKIE_PARAM=" >> $GITHUB_ENV
          fi
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      - name: Download 4K Video on Azure Gigabit Backbone (0 Proxy Traffic)
        run: |
          echo "========================================="
          echo "🚀 正在通过微软 Azure 万兆骨干网下载 4K 视频..."
          echo "目标 URL: ${{ github.event.inputs.video_url || 'https://www.youtube.com/watch?v=dSUdGBhrO5k' }}"
          echo "========================================="
          mkdir -p output
          
          # 列出格式以供验证
          yt-dlp \
            $COOKIE_PARAM \
            --remote-components ejs:github \
            -F "${{ github.event.inputs.video_url || 'https://www.youtube.com/watch?v=dSUdGBhrO5k' }}" || true
          
          # 正式下载 4K 极清视频 + 最佳音轨 + 字幕 + 缩略图
          yt-dlp \
            $COOKIE_PARAM \
            --remote-components ejs:github \
            -f "bestvideo[height<=${{ github.event.inputs.resolution || '2160' }}]+bestaudio/bestvideo+bestaudio/best" \
            --merge-output-format mp4 \
            --write-sub --write-auto-sub --sub-lang "en.*,zh.*" \
            --write-thumbnail \
            -o "output/%(title)s.%(ext)s" \
            "${{ github.event.inputs.video_url || 'https://www.youtube.com/watch?v=dSUdGBhrO5k' }}"

          echo "========================================="
          echo "✅ 下载完成！输出文件清单："
          ls -lh output/
          echo "========================================="

      - name: Upload to GitHub Artifacts (Free & High Speed)
        uses: actions/upload-artifact@v4
        with:
          name: youtube-4k-media-${{ github.run_number }}
          path: output/
          retention-days: 7
